<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Outer seal ring -->
  <circle cx="60" cy="60" r="56" fill="#0f1f3d" stroke="#c9973a" stroke-width="3"/>
  <!-- Decorative notched edge -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#c9973a" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Inner seal fill -->
  <circle cx="60" cy="60" r="44" fill="#0f1f3d"/>
  <!-- Inner gold ring -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#c9973a" stroke-width="1.5"/>
  <!-- F letterform in Playfair style -->
  <text
    x="60"
    y="78"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="62"
    font-weight="bold"
    font-style="italic"
    fill="#c9973a"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-2"
  >F</text>
  <!-- Bottom text arc simulation — REGISTRY -->
  <path id="bottomArc" d="M 18,75 A 44,44 0 0,0 102,75" fill="none"/>
  <text font-family="'DM Sans', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#c9973a" letter-spacing="2.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">REGISTRY</textPath>
  </text>
  <!-- Top text arc — FASTTRACK -->
  <path id="topArc" d="M 16,58 A 44,44 0 0,1 104,58" fill="none"/>
  <text font-family="'DM Sans', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#c9973a" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">FASTTRACK</textPath>
  </text>
  <!-- Star dividers -->
  <text x="22" y="63" font-size="7" fill="#c9973a" text-anchor="middle">★</text>
  <text x="98" y="63" font-size="7" fill="#c9973a" text-anchor="middle">★</text>
</svg>
